<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>別ネットワークへ送る — OneSend</title>
    <link rel="stylesheet" href="/css/main.css" />
    <script type="module" src="/js/remote.js"></script>
  </head>
  <body data-remote-role="sender">
    <div class="page compact-page">
      <header class="site-header"><a class="header-brand" href="/">OneSend</a><nav class="header-nav"><a href="/remote-receive.html">受け取る</a></nav></header>
      <main class="hero narrow">
        <div class="transfer-header"><div><p class="brand small">OneSend</p><h1 class="headline">別ネットワークへ送る</h1></div><a class="back-link" href="/">トップへ</a></div>
        <p class="lede">部屋IDを発行して共有し、受信側が参加したらファイルを直接転送します。</p>
        <div class="form-shell">
          <label class="drop-zone" for="file-input"><strong>ファイルを選択</strong><span>最大2GB / 64KBずつストリーミング</span></label>
          <input id="file-input" type="file" multiple />
          <div id="file-card" class="file-card hidden"><div id="file-list" class="file-list"></div></div>
          <section class="room-card">
            <h2>部屋ID</h2>
            <div class="room-actions"><button class="primary" id="create-room" type="button">部屋を作る</button><input id="room-code" class="text-input mono" inputmode="text" maxlength="6" placeholder="6文字のコード" aria-label="部屋ID"></div>
            <p id="room-status" class="hint">ファイルを選び、部屋IDを発行してください。</p>
          </section>
          <button class="primary" id="start-transfer" type="button" disabled>接続して送信</button>
          <button class="secondary" id="stop-transfer" type="button" disabled>停止</button>
          <div class="camera-overlay"><strong id="current-file">待機中</strong><div class="progress"><div class="progress-bar" id="progress-bar"></div></div><p class="progress-label" id="progress-label">0%</p><p class="speed-label" id="speed-label">送信速度: 待機中</p></div>
          <p id="banner" class="banner hidden" role="status"></p>
        </div>
      </main>
      <footer class="site-footer"><p>OneSend - P2Pファイル転送</p></footer>
    </div>
  </body>
</html>
