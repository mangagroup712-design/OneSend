<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>受け取る — OneSend</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1678b8" />
    <link rel="stylesheet" href="/css/main.css" />
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
    <script type="module" src="/js/read.js"></script>
  </head>
  <body><div class="page compact-page"><header class="site-header"><a class="header-brand" href="/">OneSend</a><nav class="header-nav" aria-label="メインメニュー"><a class="back-link" href="/">トップへ</a><a href="/send.html">送る</a><a href="/receive.html">受け取る</a></nav></header><main class="hero reader-shell">
    <div class="transfer-header"><div><p class="brand small">OneSend</p><h1 class="headline">ファイルを受け取る</h1></div></div>
    <p class="lede">この画面を開くと送信側の一覧に表示されます。届いた接続要求を確認してから受信できます。</p>
    <div class="reader-card" id="reader-card">
      <section id="text-history" class="text-history hidden" aria-live="polite"><h2>受信したテキスト</h2><div id="text-history-list"></div></section>
      <div id="result" class="preview hidden"><div id="preview-content"></div><button class="primary hidden" id="zip-download-btn" type="button">受信したファイルをまとめてZIPでダウンロード</button><button class="secondary" id="again-btn" type="button">もう一度受け取る</button></div>
      <div class="camera-overlay"><strong id="current-file">待機の準備中</strong><div class="progress"><div class="progress-bar" id="progress-bar"></div></div><p class="progress-label" id="progress-label">0%</p><p class="speed-label" id="speed-label">受信速度: 待機中</p></div>
      <div id="pairing" class="pairing">
        <section class="receive-settings" aria-labelledby="settings-heading">
          <h2 id="settings-heading">受信設定</h2>
          <label class="device-name-field">この端末の名前<input id="device-name" class="text-input" type="text" maxlength="32" autocomplete="nickname"></label>
          <label class="pin-toggle"><input id="pin-required" type="checkbox"> 受信時にPINを必要にする</label>
          <label id="pin-field" class="device-name-field hidden">PIN<input id="receive-pin" class="text-input" type="password" inputmode="numeric" maxlength="32" autocomplete="new-password"></label>
          <p class="hint">端末名はこのブラウザーで設定します。OSの端末名はブラウザーから取得できません。</p>
        </section>
        <section class="incoming-section" aria-labelledby="incoming-heading"><h2 id="incoming-heading">接続リクエスト</h2><div id="request-list" class="request-list" aria-live="polite"><p class="hint">接続要求を待っています…</p></div></section>
      </div>
      <dialog id="approval-dialog" class="approval-dialog"><div class="approval-content"><p class="brand small">受信確認</p><h2 id="approval-title">この送信を受け取りますか？</h2><div id="approval-details"></div><div class="dialog-actions"><button id="reject-approval" class="reject-request" type="button"><span aria-hidden="true">×</span> 拒否</button><button id="accept-approval" class="accept-request" type="button"><span aria-hidden="true">✓</span> 受け取る</button></div></div></dialog>
      <p id="banner" class="banner hidden" role="status"></p>
    </div>
  </main><footer class="site-footer"><p>OneSend - LANファイル転送</p></footer><script src="/js/pwa.js" defer></script></div></body>
</html>
