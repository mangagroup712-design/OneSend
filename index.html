<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OneSend — 同じネットでファイル転送</title>
    <meta name="description" content="サーバーにファイルを預けず、WebRTCでブラウザ同士が直接ファイルを送受信します。" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1678b8" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <div class="page compact-page home-center">
      <header class="site-header"><a class="header-brand" href="/">OneSend</a><nav class="header-nav" aria-label="メインメニュー"><a href="/send.html">送る</a><a href="/receive.html">受け取る</a></nav></header>
      <main class="hero">
        <p class="brand">OneSend</p>
        <h1 class="headline">ファイルを、ネットですぐ渡す。</h1>
        <p class="lede">サーバーにアップロードせず、ブラウザからブラウザへ。<br>同じWi-Fiでも、別ネットワーク間でも、大きなファイルを直接送れます。</p>
        <div class="form-shell home-actions">
          <a class="primary-link" href="/send.html">ファイルを送る <span>→</span></a>
          <a class="secondary-link" href="/receive.html">受け取る <span>↗</span></a>
          <div class="feature-grid">
            <div><strong>直接転送</strong><span>ファイルの中身はWebRTCで端末間を流れるため、シグナリングサーバーに保存されません</span></div>
            <div><strong>受信前に承認</strong><span>受信側が接続を確認。必要ならPINも設定できます</span></div>
            <div><strong>端末間で直接転送</strong><span>大きなファイルもブラウザー間で送れます（最大2GB）</span></div>
          </div>
        </div>
      </main>
      <footer class="site-footer"><p>OneSend - P2Pファイル転送</p></footer><script src="/js/pwa.js" defer></script>
    </div>
  </body>
</html>
